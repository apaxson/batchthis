{% extends 'batchthis/base.html' %}
{% load static %}
{% block content %}
<script type="module" src="{% static 'batchthis/dist/model-table.js' %}"></script>

<div class="cl-page-head"><div class="cl-wordmark font-display">Recipes</div></div>

<div class="cl-section-head">
  <div class="cl-section-title">All recipes</div>
  <div class="cl-section-note"><a href="{% url 'addRecipe' %}">Add recipe</a></div>
</div>

<div data-react-model-table
     data-endpoint="{% url 'recipe-list' %}"
     data-columns='[
       {"key": "name", "label": "Recipe", "linkField": "detail_url"},
       {"key": "style", "label": "Style"},
       {"key": "category", "label": "Category"},
       {"key": "bjcp_code", "label": "BJCP"},
       {"key": "estABV", "label": "Est ABV", "suffix": "%"},
       {"key": "brewer", "label": "Brewer"}
     ]'
     data-search-placeholder="Search recipes..."
     data-empty-message="No recipes yet."></div>

{% endblock %}
