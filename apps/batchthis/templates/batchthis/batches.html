{% extends 'batchthis/base.html' %}
{% load static %}
{% block content %}
<script type="module" src="{% static 'batchthis/dist/model-table.js' %}"></script>

<div class="cl-page-head"><div class="cl-wordmark font-display">Batches</div></div>

<div class="cl-section-head">
  <div class="cl-section-title">All batches</div>
  <div class="cl-section-note"><a href="{% url 'addBatch' %}">Add batch</a></div>
</div>

<div data-react-model-table
     data-endpoint="{% url 'batch-list' %}"
     data-columns='[
       {"key": "name", "label": "Batch", "linkField": "detail_url"},
       {"key": "style", "label": "Style"},
       {"key": "category", "label": "Category"},
       {"key": "fermenter", "label": "Fermenter"},
       {"key": "size", "label": "Size"},
       {"key": "status", "label": "Status", "badgeField": "status_class"},
       {"key": "startdate", "label": "Started", "type": "date"},
       {"key": "enddate", "label": "Ended", "type": "date"}
     ]'
     data-search-placeholder="Search batches..."
     data-empty-message="No batches yet."></div>

{% endblock %}
