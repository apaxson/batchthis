# nginx in front of gunicorn (127.0.0.1:8000, started by entrypoint.sh).
upstream batchthis_django {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # BeerSmith imports are uploaded through Django.
    client_max_body_size 20m;

    # Collected by `manage.py collectstatic` at build time (STATIC_ROOT).
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Uploaded files (MEDIA_ROOT). Served straight by nginx - NOT behind Django's login.
    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://batchthis_django;
        # $http_host keeps the port (e.g. localhost:8080) so Django's CSRF origin check matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
